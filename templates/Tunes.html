{% extends 'layout.html' %}
{% block content %}
<body>
    <div class="results"><h1>Tunes</h1>
        <table class="table">
            <thead>
                <tr>
                    <td>ID</td>
                    <td>Tune1</td>
                    <td>Tune2</td>
                    <td>Tune3</td>
                    <td>Tune4</td>
                </tr>
            </thead>

            <tbody>
                {% for tune in tunes %}
                <tr>
                    <td>{{tune.tune_id}}</td>
                    <td>{{tune.tune1}}</td>
                    <td>{{tune.tune2}}</td>
                    <td>{{tune.tune3}}</td>
                    <td>{{tune.tune4}}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
{% endblock %}
