{% extends 'layout.html' %}
{% block content %}
<body>
    <div class="results"><h1>Vehicles</h1>
        <table class="table">
            <thead>
                <tr>
                    <td>ID</td>
                    <td>Vehicle Name</td>
                </tr>
            </thead>

            <tbody>
                {% for vehicle in vehicles %}
                <tr>
                    <td>{{vehicle.vehicle_id}}</td>
                    <td>{{vehicle.vehicle_name}}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
{% endblock %}
